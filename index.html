#timer .pour{font-size:18px;opacity:.85}

#timer .bar{height:8px;background:rgba(240,241,226,.22);border-radius:4px;margin:12px 0 0;overflow:hidden}

  #app{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 400px}

<script>
const TOKEN='pk.eyJ1IjoiaG9yaWhha28iLCJhIjoiY211djd0ejljMDA5ZjMycHYxaTY3M3BsdSJ9.a1yefJYynC4k_YvllM5DVw';
const C={paper:'#DCE0C4',sheet:'#F0F1E2',sea:'#1E4A55',land:'#CDB78F',land2:'#C2AA7F',road:'#E8DCC0',ink:'#2A1B14',cherry:'#D3214F'};
const ROAST=['ライト','シナモン','ミディアム','ハイ','シティ','フルシティ','フレンチ','イタリアン'];

const GRAMS=[100,150,200,300,500];
/* 産地の表。[国, [産地名, 経度, 緯度]...] 最初の地点が国の代表 */
const ORIGIN_TABLE=[
['エチオピア',['イルガチェフェ',38.2,6.16],['グジ',38.9,5.6],['シダモ',38.5,6.7],['ハラー',42.1,9.3],['ジンマ',36.8,7.7]],
['ケニア',['ニエリ',36.95,-.42],['キリニャガ',37.3,-.5],['キアンブ',36.8,-1.1]],
['タンザニア',['キリマンジャロ',37.35,-3.2],['ムベヤ',33.45,-8.9]],
['ルワンダ',['ルワンダ',29.7,-2]],['ブルンジ',['カヤンザ',29.6,-2.9]],['ウガンダ',['エルゴン山',34.4,1.2]],['イエメン',['モカ・ハラズ',43.9,15.3]],
['コロンビア',['ウイラ',-75.6,2.5],['ナリーニョ',-77.3,1.3],['トリマ',-75.5,3.9],['カウカ',-76.6,2.4],['アンティオキア',-75.6,6.2]],
['ブラジル',['セラード',-46.9,-18.9],['南ミナス',-45.4,-21.5],['モジアナ',-47.4,-20.7],['バイーア',-41.5,-13.5]],
['グアテマラ',['アンティグア',-90.73,14.56],['ウエウエテナンゴ',-91.47,15.32],['アティトラン',-91.2,14.7]],

['ジャマイカ',['ブルーマウンテン',-76.6,18.05]],['アメリカ（ハワイ）',['コナ',-155.9,19.5]],['ドミニカ共和国',['バラオナ',-71.2,18.1]],['キューバ',['シエラマエストラ',-75.8,20.1]],
['インドネシア',['スマトラ',98.7,2.4],['アチェ・ガヨ',96.85,4.6],['トラジャ',119.9,-3],['バリ',115.2,-8.3],['ジャワ',113.8,-7.9]],
['東ティモール',['エルメラ',125.4,-8.8]],['パプアニューギニア',['ゴロカ',145.4,-6.1]],['ベトナム',['ダラット',108.4,11.9]],['ラオス',['ボラベン高原',106.4,15.2]],['タイ',['チェンライ',99.8,19.9]],['ミャンマー',['シャン州',96.5,20.8]],['インド',['マイソール',75.7,12.4]],['中国',['雲南',100.5,22.8]]
];
/* 大圏コース（SoraMiruと同じ計算） */
const D2R=Math.PI/180,RE=6371;
function gcKm(a,b){const dLat=(b[1]-a[1])*D2R,dLon=(b[0]-a[0])*D2R;const h=Math.sin(dLat/2)**2+Math.cos(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.sin(dLon/2)**2;return 2*RE*Math.asin(Math.sqrt(h));}
function gcBrg(a,b){const dl=(b[0]-a[0])*D2R,y=Math.sin(dl)*Math.cos(b[1]*D2R),x=Math.cos(a[1]*D2R)*Math.sin(b[1]*D2R)-Math.sin(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.cos(dl);return (Math.atan2(y,x)/D2R+360)%360;}
function destPt(p,az,km){const d=km/RE,b=az*D2R,la=p[1]*D2R,lo=p[0]*D2R;const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));return [lo2/D2R,la2/D2R];}
function gcLine(a,b){const pts=[],d=gcKm(a,b),az=gcBrg(a,b),n=Math.max(2,Math.ceil(d/100));let prev=null;for(let i=0;i<=n;i++){const p=destPt(a,az,d*i/n);if(prev){while(p[0]-prev[0]>180)p[0]-=360;while(p[0]-prev[0]<-180)p[0]+=360;}pts.push(p);prev=p;}pts[pts.length-1]=[b[0]+Math.round((pts[pts.length-1][0]-b[0])/360)*360,b[1]];return pts;}

const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');

const lineF=(c,props={})=>({type:'Feature',properties:props,geometry:{type:'LineString',coordinates:c}});
const ptF=(p,props={})=>({type:'Feature',properties:props,geometry:{type:'Point',coordinates:p}});
const HOME=[80,15],JAPAN=[139.4,35.65];

/* ---------- 保存（端末の中のデータベース。同じアドレスのほかのアプリとは別の入れ物） ---------- */
let idb=null;
const D={shops:[],beans:[],buys:[],tools:[],recipes:[],brews:[]};
const STORES=['shops','beans','buys','tools','recipes','brews'];
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('mamemiru',2);r.onupgradeneeded=()=>{for(const n of ['shops','beans','buys','photos','tools','recipes','brews'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'});};r.onsuccess=()=>ok(idb=r.result);r.onerror=()=>no(r.error);});}
function tx(s,mode,fn){return new Promise((ok,no)=>{const t=idb.transaction(s,mode),st=t.objectStore(s);let out;const q=fn(st);if(q)q.onsuccess=()=>out=q.result;t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error);});}
const dbAll=s=>tx(s,'readonly',st=>st.getAll());
const dbGet=(s,id)=>tx(s,'readonly',st=>st.get(id));
const dbPut=(s,o)=>tx(s,'readwrite',st=>st.put(o));
const dbDel=(s,id)=>tx(s,'readwrite',st=>st.delete(id));
async function dbLoad(){for(const n of STORES)D[n]=await dbAll(n);}
async function save(store,o){
  const i=D[store].findIndex(x=>x.id===o.id);i<0?D[store].push(o):D[store][i]=o;
  await dbPut(store,o);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
async function remove(store,id){D[store]=D[store].filter(x=>x.id!==id);await dbDel(store,id);}
const shopOf=id=>D.shops.find(s=>s.id===id);
const beanOf=id=>D.beans.find(b=>b.id===id);
const buyOf=id=>D.buys.find(b=>b.id===id);
const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||0)-(a.at||0);
const bought=()=>D.buys.filter(b=>b.bought).sort(byDate);
const per100=b=>b.price&&b.grams?Math.round(b.price/b.grams*100):null;
const originText=o=>o?[o.country,o.region].filter(Boolean).join(' '):'';
function ends(b){const be=beanOf(b.bean),s=shopOf(b.shop);if(!be||!be.origin||!be.origin.p||!s||!s.p)return null;return [be.origin.p,s.p];}
const lineOf=b=>{const e=ends(b);return e?gcLine(e[0],e[1]):null;};
function kv(k,v){try{if(v===undefined)return localStorage.getItem('mamemiru_'+k);localStorage.setItem('mamemiru_'+k,v);}catch(e){return null;}}

const state={shop:null,buy:null,close:false,picking:false};
let map=null,ready=false,run=0,follow=true,flyer=null;

/* ---------- 下の画面 ---------- */
function drawTabs(){

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function idle(ms){return new Promise(res=>{const on=()=>{clearTimeout(t);res();};map.once('idle',on);const t=setTimeout(()=>{map.off('idle',on);res();},ms);});}
const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
function satOn(on){if(!ready)return;try{map.setLayoutProperty('sat','visibility',on?'visible':'none');if(!on)map.setPaintProperty('sat','raster-opacity',0);}catch(e){}}
/* 寄りは「ゆっくり→だんだん速く」、引きはその逆。止まる瞬間だけ少しなじませる */
const endSoft=(t,e)=>t<1-e?t/(1-e/2):1-(1-t)**2/(e*(2-e));
const easeIn=t=>endSoft(t,.05)**2.4;
const easeOut=t=>1-easeIn(1-t);
const bothEnds=(t,e)=>t<e?t*t/(2*e*(1-e)):t<1-e?(t-e/2)/(1-e):1-(1-t)**2/(2*e*(1-e));
/* 農園からの引きは速く始まって減速し、店への寄りはゆっくり始まって加速する */
const flightTime=t=>{const s=bothEnds(t,.04);return s+CAM.swing*Math.sin(2*Math.PI*s)/(2*Math.PI);};
/* カメラの設計：画面に見える幅を「出発点や到着点からの距離」に比例させる。豆は画面上でほぼ一定の速さに見える */
const CAM={farmZoom:12.8,shopZoom:15.8,pitch:55,turn:16,slope:1.6,duration:6800,approach:2800,hold:250,globe:.3,swing:.7};
function cameraPlan(c){
  let S=0;for(let i=0;i<c.length-1;i++)S+=gcKm(c[i],c[i+1]);
  const zg=globeZoom(),wg=12000,w0=wg/2**(CAM.farmZoom-zg),ws=wg/2**(CAM.shopZoom-zg);
  const a=Math.max(CAM.slope,2.1*wg/S),width=x=>Math.min(wg,w0+a*x,ws+a*(S-x));
  const N=1600,dist=[],time=[0];
  for(let i=0;i<=N;i++){const v=i/N;dist.push(S*(v<.5?.5*(2*v)**5:1-.5*(2*(1-v))**5));}
  /* 地球全体が見えている区間に、全体の時間の GLOBE 割合を使う */
  const spend=(k,x)=>(1+k*smooth(.15,.7,width(x)/wg))/width(x);
  const build=k=>{let t=0,mid=0;time.length=1;for(let i=1;i<=N;i++){const ds=dist[i]-dist[i-1],d=ds*(spend(k,dist[i])+spend(k,dist[i-1]))/2;t+=d;if(width(dist[i])>=.4*wg)mid+=d;time.push(t);}return mid/t;};

  build((lo0+hi0)/2);

  return {S,zg,at(u){
    const target=u*T;let lo=0,hi=N;
    while(hi-lo>1){const m=(lo+hi)>>1;time[m]<=target?lo=m:hi=m;}
    const x=dist[lo]+(dist[hi]-dist[lo])*((target-time[lo])/Math.max(1e-9,time[hi]-time[lo]));

  }};
}
function bean(){

async function flight(b){
  if(!ready)return;
  const c=lineOf(b);if(!c)return;
  const my=++run,[origin,shop]=ends(b),plan=cameraPlan(c);
  state.close=false;
  map.setPaintProperty('routes','line-opacity',.28);
  hl([]);showFloat(null);
  const m=bean().setLngLat(origin).addTo(map);
  if(calm){hl([lineF(c)]);m.setLngLat(shop);map.jumpTo({center:shop,zoom:plan.zg+.35,pitch:0,bearing:0});showFloat(b.shop);return;}
  follow=true;
  const near=z=>smooth(plan.zg+2.5,plan.zg+7,z),satAt=z=>smooth(plan.zg+2.6,plan.zg+6,z);

      map.easeTo({center:shop,zoom:CAM.shopZoom,pitch:CAM.pitch,bearing:CAM.turn,duration:1,preloadOnly:true});}catch(e){}

  const t1=performance.now();
  await new Promise(res=>{(function tick(now){
    if(my!==run||!follow)return res();
    const p=Math.max(0,Math.min(1,(now-t1)/CAM.approach)),zoom=z0+(CAM.farmZoom-z0)*easeIn(p);
    const q=smooth(0,.62,p)*wayN,i=Math.min(wayN-1,Math.floor(q)),u=q-i;
    const pos=[way[i][0]+(way[i+1][0]-way[i][0])*u,way[i][1]+(way[i+1][1]-way[i][1])*u];
    map.jumpTo({center:p>=.62?origin:pos,zoom,pitch:CAM.pitch*near(zoom),bearing:-CAM.turn*near(zoom)});
    map.setPaintProperty('sat','raster-opacity',satAt(zoom));

  })(t1);});

  hl([lineF(c)]);hlTrim([0,1]);
  let satGone=false;

    if(my!==run)return res();
    const p=Math.max(0,Math.min(1,(now-t0)/CAM.duration)),{x,zoom}=plan.at(flightTime(p));

    const pos=[c[i][0]+(c[i+1][0]-c[i][0])*u,c[i][1]+(c[i+1][1]-c[i][1])*u];

    m.setLngLat(pos);

function refocus(){

/* ---------- 地図で場所を指定 ---------- */
function pick({title,center,zoom,sat,geo}){
  return new Promise(res=>{
    if(!ready)return res(undefined);
    clearFlight();state.picking=true;follow=false;
    $('layer1').hidden=$('layer2').hidden=true;
    $('cross').hidden=false;$('float').hidden=true;
    if(sat){satOn(true);map.setPaintProperty('sat','raster-opacity',1);}
    map.flyTo({center,zoom,pitch:0,bearing:0,duration:1200,essential:true});
    const bar=$('pickBar');bar.hidden=false;
    bar.innerHTML=`<b>${esc(title)}</b><div>地図を動かして、十字を場所に合わせてください。二本指で拡大できます。</div>
      <div class="acts" style="margin-top:0">${geo?'<button class="btn" id="pGeo">今いる場所を使う</button>':''}<button class="btn main" id="pOk">ここに決める</button><button class="btn" id="pNo">やめる</button></div><div class="err" id="pErr" hidden></div>`;
    const done=p=>{bar.hidden=true;$('cross').hidden=true;$('layer1').hidden=$('layer2').hidden=false;state.picking=false;follow=true;satOn(false);res(p);};
    $('pOk').onclick=()=>{const c=map.getCenter().wrap();done([+c.lng.toFixed(5),+c.lat.toFixed(5)]);};
    $('pNo').onclick=()=>done(null);
    if(geo)$('pGeo').onclick=()=>{
      if(!navigator.geolocation){$('pErr').hidden=false;$('pErr').textContent='この端末では現在地を使えません。地図で合わせてください。';return;}
      navigator.geolocation.getCurrentPosition(g=>map.flyTo({center:[g.coords.longitude,g.coords.latitude],zoom:16.5,duration:1200,essential:true}),()=>{$('pErr').hidden=false;$('pErr').textContent='現在地を取得できませんでした。地図で合わせてください。';},{enableHighAccuracy:true,timeout:9000});
    };
  });
}

/* ---------- お店の入力 ---------- */
function openShop(shop,onDone){
  const d=shop?{...shop}:{name:'',p:null,memo:''};

      <div class="field"><label for="sMemo">メモ（定休日など）</label><textarea id="sMemo">${esc(d.memo)}</textarea></div>
      ${shop&&!used?'<div class="field"><button class="btn" id="sDel">このお店を消す</button></div>':''}
    </div><footer><div class="err" id="sErr" hidden></div><button class="btn main" id="sSave">お店を保存</button></footer></div>`;

  const close=()=>{L.innerHTML='';};
  $('sClose').onclick=close;
  $('sPick').onclick=async()=>{
    const last=D.shops.filter(s=>s.p).slice(-1)[0];
    const p=await pick({title:'お店の場所を指定',center:d.p||(last&&last.p)||JAPAN,zoom:d.p?15:11,geo:true});

    const o={id:(shop&&shop.id)||uid(),at:(shop&&shop.at)||Date.now(),name,p:d.p,memo:$('sMemo').value.trim()};

}

/* ---------- 味のチャートの入力（指を置いた方向の軸を、中心からの距離で 1〜5 に合わせる） ---------- */
function tasteInput(el,get,set,ghost){
  const cx=120,cy=108,R=76;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5,r=R*v/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=vals=>vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  const paint=()=>{
    const v=get(),shape=v||[3,3,3,3,3];
    let s=`<svg id="tasteIn" viewBox="0 0 240 216" role="img" aria-label="味のチャートの入力">`;
    [1,2,3,4,5].forEach(n=>s+=`<polygon points="${poly(Array(5).fill(n))}" fill="none" stroke="#C4C8A8" stroke-width="${n===5?1:.75}"/>`);
    for(let i=0;i<5;i++){const[x,y]=pt(i,5);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#C4C8A8" stroke-width=".75"/>`;}
    if(ghost)s+=`<polygon points="${poly(ghost)}" fill="none" stroke="#2A1B14" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s+=`<polygon points="${poly(shape)}" fill="#B3173F" fill-opacity="${v?.18:.06}" stroke="#B3173F" stroke-opacity="${v?1:.35}" stroke-width="2" stroke-linejoin="round"/>`;
    shape.forEach((n,i)=>{const[x,y]=pt(i,n);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="#B3173F" fill-opacity="${v?1:.35}" stroke="#F0F1E2" stroke-width="2"/>`;});
    AXES.forEach((a,i)=>{const[x,y]=pt(i,6.15);s+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${a}${v?' '+v[i]:''}</text>`;});
    el.innerHTML=s+'</svg>';
    el.querySelector('svg').addEventListener('pointerdown',down);
  };
  /* 描き直すと要素が入れ替わるので、指の位置は毎回いまの要素で測る */
  const hit=(e,fixed)=>{
    const r=el.querySelector('svg').getBoundingClientRect(),k=240/r.width,x=(e.clientX-r.left)*k-cx,y=(e.clientY-r.top)*k-cy;
    let axis=fixed;
    if(axis==null){let a=Math.atan2(y,x)+Math.PI/2;if(a<0)a+=2*Math.PI;axis=Math.round(a/(2*Math.PI/5))%5;}
    const ang=-Math.PI/2+axis*2*Math.PI/5,along=x*Math.cos(ang)+y*Math.sin(ang);
    const v=get()?[...get()]:(ghost?[...ghost]:[3,3,3,3,3]);
    v[axis]=Math.max(1,Math.min(5,Math.round(along/R*5)));
    set(v);
    return axis;
  };
  const down=e=>{
    e.preventDefault();
    const ax=hit(e,null);paint();
    const move=m=>{m.preventDefault();hit(m,ax);paint();};
    const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);};
    addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up);
  };
  paint();
}

const RATE=['いまいち','ふつう','おいしい'];
const brewsOf=beanId=>D.brews.filter(x=>beanOf(buyOf(x.buy)?.bean)?.id===beanId).sort((a,b)=>b.at-a.at);
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const toolsOf=k=>D.tools.filter(t=>t.kind===k).sort((a,b)=>a.at-b.at);
const grindText=(c,m)=>{const per=(m&&m.per)||10;return `${Math.floor(c/per)}.${c%per}`;};
function tasteOf(b){
  if(b.taste)return b.taste;
  const t=brewsOf(b.bean).filter(x=>x.buy===b.id&&x.taste);
  return t.length?AXES.map((_,i)=>Math.round(t.reduce((s,x)=>s+x.taste[i],0)/t.length)):null;

  const host=document.createElement('div');document.body.append(host);
  let sound=kv('sound')!=='0',ac=null,started=false,base=0,pausedAt=0,paused=false,lock=null,cur=-1,timer=0,stopped=false;
  const beep=()=>{if(!sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.13);}catch(e){}};
  const wake=async()=>{try{if('wakeLock'in navigator&&!lock&&!stopped){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;});}}catch(e){}};
  const onVis=()=>{if(document.visibilityState==='visible'&&started)wake();};
  document.addEventListener('visibilitychange',onVis);
  const elapsed=()=>!started?0:((paused?pausedAt:Date.now())-base)/1000;
  const prevEnd=i=>i?ends[i-1]:0;
  const pourOf=i=>Math.max(0,steps[i].to-(i?steps[i-1].to:0));
  host.innerHTML=`<div id="timer"><div class="top"><div class="bean-name">${esc(be.name)}</div><button id="tSound"></button></div>
    <div class="now"><div class="step" id="tStep"></div><div class="goal"><span id="tGoal"></span><small>gまで</small></div><div class="pour" id="tPour"></div><div class="clock" id="tClock">0:00</div><div class="bar"><i id="tBar" style="width:0"></i></div></div>
    <ol id="tList">${steps.map(s=>`<li><span>${esc(s.label)}</span><span>${s.to}g</span></li>`).join('')}</ol>
    <div class="ctl"><button id="tStop">やめる</button><button id="tNext" hidden>次へ</button><button id="tGo" class="go">スタート</button></div></div>`;
  const li=[...host.querySelectorAll('#tList li')];
  const soundBtn=()=>{$('tSound').textContent=sound?'音あり':'音なし';};soundBtn();
  $('tSound').onclick=()=>{sound=!sound;kv('sound',sound?'1':'0');soundBtn();};
  const paintStep=i=>{
    cur=i;$('tStep').textContent=steps[i].label;$('tGoal').textContent=steps[i].to;
    $('tPour').textContent=pourOf(i)?`${pourOf(i)}g 注ぐ`:'待つ';
    li.forEach((l,n)=>{l.className=n===i?'on':n<i?'past':'';});
  };
  paintStep(0);
  const finish=()=>{const secs=Math.round(elapsed());stop();host.remove();brewFinish(d,secs);};
  const stop=()=>{stopped=true;clearInterval(timer);document.removeEventListener('visibilitychange',onVis);if(lock){lock.release().catch(()=>{});lock=null;}if(ac)ac.close().catch(()=>{});};
  const tick=()=>{
    const e=elapsed();
    if(e>=ends[ends.length-1]){beep();return finish();}
    const i=ends.findIndex(x=>e<x);
    if(i!==cur){paintStep(i);if(navigator.vibrate)navigator.vibrate([160,80,160]);beep();}
    $('tClock').textContent=mmss(Math.floor(e));
    $('tBar').style.width=Math.min(100,(e-prevEnd(i))/(ends[i]-prevEnd(i))*100)+'%';
  };
  $('tGo').onclick=()=>{
    if(!started){
      started=true;base=Date.now();
      try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
      wake();timer=setInterval(tick,120);
      $('tNext').hidden=false;$('tGo').textContent='止める';$('tGo').classList.remove('go');
      return;
    }
    if(!paused){paused=true;pausedAt=Date.now();$('tGo').textContent='再開';$('tGo').classList.add('go');}
    else{base+=Date.now()-pausedAt;paused=false;$('tGo').textContent='止める';$('tGo').classList.remove('go');}
  };
  /* 「次へ」：今の手順をここで終わりにして、以降の時間を前へずらす */
  $('tNext').onclick=()=>{const e=elapsed(),i=ends.findIndex(x=>e<x);if(i<0)return;const shift=e-ends[i];for(let j=i;j<ends.length;j++)ends[j]+=shift;tick();};
  let armed=false;
  $('tStop').onclick=()=>{if(!started){stop();host.remove();brewSetup(d.buy,d);return;}if(!armed){armed=true;$('tStop').textContent='もう一度で中止';setTimeout(()=>{armed=false;if($('tStop'))$('tStop').textContent='やめる';},3000);return;}stop();host.remove();brewSetup(d.buy,d);};
}
function brewFinish(d,secs){
  const L=$('layer1'),f={rating:null,taste:null};
  const be=beanOf(buyOf(d.buy).bean);
  L.innerHTML=`<div class="over"><header><h2>どうでしたか</h2><button id="zSkip">記録しない</button></header><div class="scroll">
    <p class="memo" style="margin-top:14px">${esc(be.name)}　${mmss(secs)}で淹れました</p>
    <div class="field"><div class="chips" id="zRate"></div></div>
    <div class="field"><span class="t">味のチャート（書かなくても大丈夫です）</span><div id="zTaste"></div></div>
    <div class="field"><label for="zMemo">メモ</label><textarea id="zMemo"></textarea></div>
  </div><footer><div class="err" id="zErr" hidden></div><button class="btn main" id="zSave">記録する</button></footer></div>`;
  const rate=()=>{const el=$('zRate');el.innerHTML=[2,1,0].map(v=>`<button type="button" class="chip" aria-pressed="${f.rating===v}" data-v="${v}">${RATE[v]}</button>`).join('');el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;f.rating=f.rating===v?null:v;rate();});};
  rate();
  const prevT=brewsOf(be.id).find(x=>x.taste)?.taste;
  tasteInput($('zTaste'),()=>f.taste,v=>{f.taste=v;},prevT||buyOf(d.buy).shopTaste||null);
  const back=()=>{L.innerHTML='';state.buy=d.buy;drawDetail(buyOf(d.buy));};
  let armed=false;
  $('zSkip').onclick=()=>{if(!armed){armed=true;$('zSkip').textContent='もう一度で閉じる';return;}back();};
  $('zSave').onclick=async()=>{
    try{await save('brews',{id:uid(),at:Date.now(),date:today(),buy:d.buy,recipe:d.recipe,mill:d.mill,dripper:d.dripper||null,grind:d.grind,dose:d.dose,water:d.water,temp:d.temp,secs,rating:f.rating,taste:f.taste,memo:$('zMemo').value.trim()});back();}
    catch(e){$('zErr').hidden=false;$('zErr').textContent='保存できませんでした。もう一度押してください。';}
  };
}
function openBrewView(id){
  const x=D.brews.find(b=>b.id===id);if(!x)return;
  const L=$('layer2'),m=D.tools.find(t=>t.id===x.mill),rec=D.recipes.find(r=>r.id===x.recipe),be=beanOf(buyOf(x.buy)?.bean)||{};
  L.innerHTML=`<div class="over"><header><h2>この一杯</h2><button id="vClose">閉じる</button></header><div class="scroll"><p class="memo" style="margin-top:14px">${esc(be.name)}</p>
    <dl>${[['日付',jd(x.date)],['評価',x.rating!=null?RATE[x.rating]:''],['淹れ方',rec&&rec.name],['ミル',m&&`${m.name} ${grindText(x.grind,m)}`],['豆',x.dose+'g'],['お湯',x.water+'g'],['湯温',x.temp+'℃'],['時間',mmss(x.secs)]].filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
    ${x.taste?`<div style="margin-top:12px">${radar(x.taste,null)}</div>`:''}${x.memo?`<p class="memo">${esc(x.memo)}</p>`:''}
    <div class="field"><button class="btn" id="vDel">この一杯を消す</button></div></div></div>`;
  $('vClose').onclick=()=>{L.innerHTML='';};
  let armed=false;
  $('vDel').onclick=async()=>{if(!armed){armed=true;$('vDel').textContent='もう一度押すと消します';return;}await remove('brews',id);L.innerHTML='';const b=state.buy&&buyOf(state.buy);if(b)drawDetail(b);};
}

/* ---------- 起動 ---------- */
const MB='https://api.mapbox.com/mapbox-gl-js/v3.9.0';
function initMap(){
  mapboxgl.accessToken=TOKEN;
  map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',center:HOME,zoom:1,projection:'globe',pixelRatio:Math.min(devicePixelRatio||1,2)});
  map.jumpTo({zoom:globeZoom()});
  map.on('style.load',()=>{addLayers();opening();});
  map.on('error',e=>{const st=e.error&&e.error.status;if((st===401||st===403)&&e.sourceId!=='sat')fail('地図を読み込めません。MapboxのトークンのURL制限に、このページのアドレスを追加してください。');});
  map.on('dragstart',()=>{if(!state.picking)follow=false;});
  map.on('click',e=>{
    if(!ready||state.picking)return;
    const r=16,box=[[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]];
    const hit=map.queryRenderedFeatures(box,{layers:['shops','origins']});
    if(!hit.length)return;
    const sh=hit.find(f=>f.layer.id==='shops');
    if(sh)return pickShop(sh.properties.k);
    pickBuy(hit[0].properties.id,true);
  });
  addEventListener('resize',()=>map.resize());
}
function loadMap(){
  const css=document.createElement('link');css.rel='stylesheet';css.href=MB+'/mapbox-gl.css';document.head.append(css);
  const sc=document.createElement('script');sc.src=MB+'/mapbox-gl.js';sc.onload=initMap;
  sc.onerror=()=>fail('地球儀は通信できるときに表示されます。記録はこのまま使えます。');
  document.head.append(sc);
  setTimeout(()=>{if(!ready)fail('地球儀は通信できるときに表示されます。記録はこのまま使えます。');},10000);
}
$('add').onclick=()=>openForm({});
$('brewBtn').onclick=()=>openBrew();
$('moreBtn').onclick=openMore;
(async()=>{
  try{await openDB();await dbLoad();}
  catch(e){fail('この端末では記録を保存できません。ブラウザの設定を確認してください。');}
  drawTabs();drawList();loadMap();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
})();
